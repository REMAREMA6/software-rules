name: BullMQ pinned-source runtime probe

on:
  push:
    paths:
      - "conformance/replication-lab/cases/BMQ-ER-002/compare_retry_probe.py"
      - "conformance/replication-lab/cases/BMQ-ER-002/build_software_rules_artifacts.py"
      - "conformance/replication-lab/projects/retry-policy-python/replicate_retry_probe.py"
      - "conformance/validation/validate-case-artifacts.mjs"
      - "conformance/replication-lab/probes/bullmq-retry-runtime.cjs"
      - ".github/workflows/bullmq-pinned-runtime.yml"
  pull_request:
    paths:
      - "conformance/replication-lab/cases/BMQ-ER-002/**"
      - "conformance/replication-lab/probes/bullmq-retry-runtime.cjs"
      - ".github/workflows/bullmq-pinned-runtime.yml"
  workflow_dispatch:

concurrency:
  group: bullmq-pinned-runtime
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pinned-bullmq-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout exact BullMQ source commit
        env:
          BULLMQ_SOURCE_COMMIT: "526668f2c5e6de9d5d664df577f09a6bdccac1b4"
        run: |
          mkdir -p /tmp/bullmq
          git -C /tmp/bullmq init
          git -C /tmp/bullmq remote add origin https://github.com/taskforcesh/bullmq.git
          git -C /tmp/bullmq fetch --depth=1 origin "$BULLMQ_SOURCE_COMMIT"
          git -C /tmp/bullmq checkout --detach FETCH_HEAD
          test "$(git -C /tmp/bullmq rev-parse HEAD)" = "$BULLMQ_SOURCE_COMMIT"
      - name: Install pinned source dependencies
        working-directory: /tmp/bullmq
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Build pinned BullMQ source
        working-directory: /tmp/bullmq
        run: yarn build
      - name: Run source runtime probe
        working-directory: /tmp/bullmq
        env:
          BULLMQ_SOURCE_COMMIT: "526668f2c5e6de9d5d664df577f09a6bdccac1b4"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: |
          set -o pipefail
          cp "$GITHUB_WORKSPACE/conformance/replication-lab/probes/bullmq-retry-runtime.cjs" ./software-rules-retry-probe.cjs
          node ./software-rules-retry-probe.cjs | tee "$GITHUB_WORKSPACE/bullmq-runtime-capture.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate independent Python replica capture
        run: |
          python "$GITHUB_WORKSPACE/conformance/replication-lab/projects/retry-policy-python/replicate_retry_probe.py" > "$GITHUB_WORKSPACE/bullmq-replica-capture.json"
      - name: Compare source and independent replica captures
        run: |
          set -o pipefail
          python "$GITHUB_WORKSPACE/conformance/replication-lab/cases/BMQ-ER-002/compare_retry_probe.py" "$GITHUB_WORKSPACE/bullmq-runtime-capture.json" "$GITHUB_WORKSPACE/bullmq-replica-capture.json" | tee "$GITHUB_WORKSPACE/bullmq-comparison-report.json"
      - name: Build Software Rules captures and comparison report
        run: |
          evidence_dir="conformance/replication-lab/cases/BMQ-ER-002/artifacts"
          mkdir -p "$evidence_dir"
          cp bullmq-runtime-capture.json "$evidence_dir/bullmq-runtime-capture.json"
          cp bullmq-replica-capture.json "$evidence_dir/bullmq-replica-capture.json"
          python "$GITHUB_WORKSPACE/conformance/replication-lab/cases/BMQ-ER-002/build_software_rules_artifacts.py" \
            --source "$GITHUB_WORKSPACE/bullmq-runtime-capture.json" \
            --replica "$GITHUB_WORKSPACE/bullmq-replica-capture.json" \
            --output-dir "$GITHUB_WORKSPACE/bullmq-software-rules"
      - name: Validate Software Rules captures, comparison, and evidence integrity
        run: |
          npm install --prefix conformance/validation --no-audit --no-fund
          node conformance/validation/validate-case-artifacts.mjs \
            "$GITHUB_WORKSPACE/bullmq-software-rules/bullmq-source.capture.json" \
            "$GITHUB_WORKSPACE/bullmq-software-rules/bullmq-python-replica.capture.json" \
            "$GITHUB_WORKSPACE/bullmq-software-rules/bullmq-comparison.report.json"
      - name: Commit verified case evidence to the repository
        if: success() && github.event_name != 'pull_request'
        run: |
          evidence_dir="conformance/replication-lab/cases/BMQ-ER-002/artifacts"
          mkdir -p "$evidence_dir"
          cp bullmq-runtime-capture.json "$evidence_dir/bullmq-runtime-capture.json"
          cp bullmq-replica-capture.json "$evidence_dir/bullmq-replica-capture.json"
          cp bullmq-comparison-report.json "$evidence_dir/bullmq-raw-comparison-report.json"
          cp bullmq-software-rules/bullmq-source.capture.json "$evidence_dir/bullmq-source.capture.json"
          cp bullmq-software-rules/bullmq-python-replica.capture.json "$evidence_dir/bullmq-python-replica.capture.json"
          cp bullmq-software-rules/bullmq-comparison.report.json "$evidence_dir/bullmq-comparison.report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence_dir"
          if ! git diff --cached --quiet; then
            git commit -m "test: retain verified BullMQ cross-stack evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Retain source, replica, and Software Rules captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullmq-cross-stack-captures
          path: |
            bullmq-runtime-capture.json
            bullmq-replica-capture.json
            bullmq-comparison-report.json
            bullmq-software-rules/*.json
            conformance/replication-lab/cases/BMQ-ER-002/artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

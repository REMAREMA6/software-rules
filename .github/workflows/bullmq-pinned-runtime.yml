name: BullMQ pinned-source runtime probe

on:
  push:
    paths:
      - "conformance/replication-lab/cases/BMQ-ER-002/compare_retry_probe.py"
      - "conformance/replication-lab/probes/bullmq-retry-runtime.cjs"
      - ".github/workflows/bullmq-pinned-runtime.yml"
  pull_request:
    paths:
      - "conformance/replication-lab/cases/BMQ-ER-002/**"
      - "conformance/replication-lab/probes/bullmq-retry-runtime.cjs"
      - ".github/workflows/bullmq-pinned-runtime.yml"
  workflow_dispatch:

concurrency:
  group: bullmq-pinned-runtime
  cancel-in-progress: true

jobs:
  pinned-bullmq-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout exact BullMQ source commit
        env:
          BULLMQ_SOURCE_COMMIT: "526668f2c5e6de9d5d664df577f09a6bdccac1b4"
        run: |
          mkdir -p /tmp/bullmq
          git -C /tmp/bullmq init
          git -C /tmp/bullmq remote add origin https://github.com/taskforcesh/bullmq.git
          git -C /tmp/bullmq fetch --depth=1 origin "$BULLMQ_SOURCE_COMMIT"
          git -C /tmp/bullmq checkout --detach FETCH_HEAD
          test "$(git -C /tmp/bullmq rev-parse HEAD)" = "$BULLMQ_SOURCE_COMMIT"
      - name: Install pinned source dependencies
        working-directory: /tmp/bullmq
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Build pinned BullMQ source
        working-directory: /tmp/bullmq
        run: yarn build
      - name: Run source runtime probe
        working-directory: /tmp/bullmq
        env:
          BULLMQ_SOURCE_COMMIT: "526668f2c5e6de9d5d664df577f09a6bdccac1b4"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: |
          set -o pipefail
          cp "$GITHUB_WORKSPACE/conformance/replication-lab/probes/bullmq-retry-runtime.cjs" ./software-rules-retry-probe.cjs
          node ./software-rules-retry-probe.cjs | tee "$GITHUB_WORKSPACE/bullmq-runtime-capture.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate independent Python replica capture
        run: |
          python "$GITHUB_WORKSPACE/conformance/replication-lab/projects/retry-policy-python/replicate_retry_probe.py" > "$GITHUB_WORKSPACE/bullmq-replica-capture.json"
      - name: Compare source and independent replica captures
        run: |
          set -o pipefail
          python "$GITHUB_WORKSPACE/conformance/replication-lab/cases/BMQ-ER-002/compare_retry_probe.py" "$GITHUB_WORKSPACE/bullmq-runtime-capture.json" "$GITHUB_WORKSPACE/bullmq-replica-capture.json" | tee "$GITHUB_WORKSPACE/bullmq-comparison-report.json"
      - name: Retain source, replica, and comparison captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullmq-cross-stack-captures
          path: |
            bullmq-runtime-capture.json
            bullmq-replica-capture.json
            bullmq-comparison-report.json
          if-no-files-found: warn
          retention-days: 30

name: Medusa promotion rule eligibility cross-stack conformance

on:
  push:
    paths:
      - "conformance/replication-lab/cases/MEDUSA-PROMO-001/**"
      - "conformance/replication-lab/projects/medusa-promotion-python/**"
      - ".github/workflows/medusa-promotion-runtime.yml"
      - "conformance/validation/validate-case-artifacts.mjs"
  pull_request:
    paths:
      - "conformance/replication-lab/cases/MEDUSA-PROMO-001/**"
      - "conformance/replication-lab/projects/medusa-promotion-python/**"
      - ".github/workflows/medusa-promotion-runtime.yml"
      - "conformance/validation/validate-case-artifacts.mjs"
  workflow_dispatch:

concurrency:
  group: medusa-promotion-runtime-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-rule-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout immutable Medusa source
        env:
          MEDUSA_SOURCE_COMMIT: "6e28e10acb9676392315b3ff1a9c7147fce4b5ab"
        run: |
          git init /tmp/medusa
          git -C /tmp/medusa remote add origin https://github.com/medusajs/medusa.git
          git -C /tmp/medusa fetch --depth=1 origin "$MEDUSA_SOURCE_COMMIT"
          git -C /tmp/medusa checkout --detach FETCH_HEAD
          test "$(git -C /tmp/medusa rev-parse HEAD)" = "$MEDUSA_SOURCE_COMMIT"
      - name: Install pinned TypeScript compiler
        run: |
          npm install --prefix /tmp/medusa-toolchain --no-audit --no-fund typescript@6.0.2
          node -e "const ts=require('/tmp/medusa-toolchain/node_modules/typescript'); if(ts.version!=='6.0.2') process.exit(1)"
      - name: Execute exact pinned Medusa promotion rule functions
        env:
          MEDUSA_SOURCE_ROOT: /tmp/medusa
          MEDUSA_SOURCE_COMMIT: "6e28e10acb9676392315b3ff1a9c7147fce4b5ab"
          TYPESCRIPT_PATH: /tmp/medusa-toolchain/node_modules/typescript
        run: node conformance/replication-lab/cases/MEDUSA-PROMO-001/source_probe.cjs > medusa-promo-source-runtime.json
      - name: Execute independent Python rule evaluator
        run: python conformance/replication-lab/projects/medusa-promotion-python/replica_probe.py > medusa-promo-python-runtime.json
      - name: Compare all 32 rule evaluation outcomes
        run: python conformance/replication-lab/cases/MEDUSA-PROMO-001/compare.py medusa-promo-source-runtime.json medusa-promo-python-runtime.json
      - name: Run eight deliberate promotion-rule mutations
        run: python -m unittest discover -s conformance/replication-lab/cases/MEDUSA-PROMO-001 -p "test_*.py" -v
      - name: Stage pinned source and runtime evidence
        run: |
          evidence_dir="conformance/replication-lab/cases/MEDUSA-PROMO-001/artifacts"
          mkdir -p "$evidence_dir"
          cp medusa-promo-source-runtime.json "$evidence_dir/medusa-promo-source-runtime.json"
          cp medusa-promo-python-runtime.json "$evidence_dir/medusa-promo-python-runtime.json"
          cp /tmp/medusa/packages/modules/promotion/src/utils/validations/promotion-rule.ts "$evidence_dir/promotion-rule.ts"
          cp /tmp/medusa/packages/modules/promotion/integration-tests/__tests__/services/promotion-module/evaluate-rule-value-condition.spec.ts "$evidence_dir/evaluate-rule-value-condition.spec.ts"
          cp /tmp/medusa/yarn.lock "$evidence_dir/yarn.lock"
          cp /tmp/medusa-toolchain/package-lock.json "$evidence_dir/typescript-toolchain-package-lock.json"
          python conformance/replication-lab/cases/MEDUSA-PROMO-001/build_software_rules_artifacts.py \
            --source "$GITHUB_WORKSPACE/medusa-promo-source-runtime.json" \
            --replica "$GITHUB_WORKSPACE/medusa-promo-python-runtime.json" \
            --output-dir "$GITHUB_WORKSPACE/medusa-promo-software-rules" \
            --source-artifacts "{\"promotionRuleFunctions\":\"$GITHUB_WORKSPACE/$evidence_dir/promotion-rule.ts\",\"sourceTests\":\"$GITHUB_WORKSPACE/$evidence_dir/evaluate-rule-value-condition.spec.ts\",\"sourceLockfile\":\"$GITHUB_WORKSPACE/$evidence_dir/yarn.lock\",\"typescriptLockfile\":\"$GITHUB_WORKSPACE/$evidence_dir/typescript-toolchain-package-lock.json\"}"
      - name: Validate Software Rules captures, comparison, and evidence integrity
        run: |
          npm install --prefix conformance/validation --no-audit --no-fund
          node conformance/validation/validate-case-artifacts.mjs \
            medusa-promo-software-rules/medusa-promo-source.capture.json \
            medusa-promo-software-rules/medusa-promo-python-replica.capture.json \
            medusa-promo-software-rules/medusa-promo-comparison.report.json
      - name: Retain source, replica, comparison, and Software Rules evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medusa-promotion-rule-cross-stack
          path: |
            medusa-promo-source-runtime.json
            medusa-promo-python-runtime.json
            medusa-promo-software-rules/*.json
            conformance/replication-lab/cases/MEDUSA-PROMO-001/artifacts/*
          if-no-files-found: warn
          retention-days: 30

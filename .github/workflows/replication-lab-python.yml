name: Replication Lab — Python rule models

on:
  push:
    paths:
      - "conformance/replication-lab/projects/**"
      - ".github/workflows/replication-lab-python.yml"
  pull_request:
    paths:
      - "conformance/replication-lab/projects/**"
      - ".github/workflows/replication-lab-python.yml"
  workflow_dispatch:

jobs:
  python-rule-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent rule-model and comparison tests
        run: |
          python -m unittest discover -s conformance/replication-lab/projects/retry-policy-python -v
          python -m unittest discover -s conformance/replication-lab/cases/BMQ-ER-002 -p "test_*.py" -v
          python conformance/replication-lab/projects/retry-policy-python/replicate_retry_probe.py > /tmp/bullmq-replica-capture.json

name: Replication Lab — Python rule models

on:
  push:
    paths:
      - "conformance/replication-lab/projects/**"
      - "conformance/replication-lab/cases/**"
      - "!conformance/replication-lab/cases/**/artifacts/**"
      - ".github/workflows/replication-lab-python.yml"
  pull_request:
    paths:
      - "conformance/replication-lab/projects/**"
      - ".github/workflows/replication-lab-python.yml"
  workflow_dispatch:

jobs:
  python-rule-models:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python conformance-test dependencies
        run: pip install "redis==6.4.0"
      - name: Run independent rule-model and comparison tests
        run: |
          find conformance/replication-lab/cases -name "test_*.py" -type f -print0 | sort -z | while IFS= read -r -d '' test_file; do
            echo "Running $test_file"
            python "$test_file"
          done
          python -m unittest discover -s conformance/replication-lab/projects/retry-policy-python -v
          python conformance/replication-lab/projects/retry-policy-python/replicate_retry_probe.py > /tmp/bullmq-replica-capture.json
          python conformance/replication-lab/projects/express-routing-python/replica_probe.py > /tmp/express-replica-capture.json
          python conformance/replication-lab/projects/typeorm-transaction-python/replica_probe.py > /tmp/typeorm-replica-capture.json
          python conformance/replication-lab/projects/medusa-price-date-python/replica_probe.py > /tmp/medusa-replica-capture.json

name: TypeORM persistence cross-stack conformance (verification)

on:
  push:
    paths:
      - "conformance/replication-lab/cases/TORM-PERSIST-001/**"
      - "conformance/replication-lab/projects/typeorm-sqlite-python/**"
      - ".github/workflows/typeorm-persistence-runtime.yml"
  pull_request:
    paths:
      - "conformance/replication-lab/cases/TORM-PERSIST-001/**"
      - "conformance/replication-lab/projects/typeorm-sqlite-python/**"
      - ".github/workflows/typeorm-persistence-runtime.yml"
  workflow_dispatch:

concurrency:
  group: typeorm-persistence
  cancel-in-progress: true

jobs:
  typeorm-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout exact TypeORM source commit
        env:
          TYPEORM_SOURCE_COMMIT: "b1e211fc2654d412612a08f8a7fb890f3352614f"
        run: |
          mkdir -p /tmp/typeorm
          git -C /tmp/typeorm init
          git -C /tmp/typeorm remote add origin https://github.com/typeorm/typeorm.git
          git -C /tmp/typeorm fetch --depth=1 origin "$TYPEORM_SOURCE_COMMIT"
          git -C /tmp/typeorm checkout --detach FETCH_HEAD
          test "$(git -C /tmp/typeorm rev-parse HEAD)" = "$TYPEORM_SOURCE_COMMIT"
      - name: Install pinned workspace dependencies
        working-directory: /tmp/typeorm
        run: |
          npm install --global pnpm@12.22.0
          pnpm --version
          pnpm install --filter typeorm... --include-workspace-root --frozen-lockfile --ignore-scripts
      - name: Compile TypeORM from pinned source
        working-directory: /tmp/typeorm
        run: pnpm --filter typeorm exec tsc -p tsconfig.node.json
      - name: Run pinned TypeORM transaction probe
        env:
          TYPEORM_SOURCE_COMMIT: "b1e211fc2654d412612a08f8a7fb890f3352614f"
        run: |
          node conformance/replication-lab/cases/TORM-PERSIST-001/source_probe.cjs > typeorm-source-capture.json
          python -c "import json; d=json.load(open('typeorm-source-capture.json')); assert d['passed'] is True; print('Pinned TypeORM runtime assertions passed')"
      - name: Run independent Python SQLite replica
        run: python conformance/replication-lab/projects/typeorm-sqlite-python/replica_probe.py > typeorm-replica-capture.json
      - name: Compare source and replica outcomes
        run: |
          python conformance/replication-lab/cases/TORM-PERSIST-001/compare.py typeorm-source-capture.json typeorm-replica-capture.json | tee typeorm-comparison.json
      - name: Run comparator mutation tests
        run: python -m unittest discover -s conformance/replication-lab/cases/TORM-PERSIST-001 -p "test_*.py" -v
      - name: Retain TypeORM source and replica evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeorm-persistence-cross-stack-captures
          path: |
            typeorm-source-capture.json
            typeorm-replica-capture.json
            typeorm-comparison.json
          if-no-files-found: warn
          retention-days: 30

name: TypeORM persistence cross-stack conformance (verification)

on:
  push:
    paths:
      - "conformance/replication-lab/cases/TORM-PERSIST-001/**"
      - "conformance/replication-lab/projects/typeorm-sqlite-python/**"
      - ".github/workflows/typeorm-persistence-runtime.yml"
  pull_request:
    paths:
      - "conformance/replication-lab/cases/TORM-PERSIST-001/**"
      - "conformance/replication-lab/projects/typeorm-sqlite-python/**"
      - ".github/workflows/typeorm-persistence-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typeorm-persistence
  cancel-in-progress: true

jobs:
  typeorm-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout exact TypeORM source commit
        env:
          TYPEORM_SOURCE_COMMIT: "b1e211fc2654d412612a08f8a7fb890f3352614f"
        run: |
          mkdir -p /tmp/typeorm
          git -C /tmp/typeorm init
          git -C /tmp/typeorm remote add origin https://github.com/typeorm/typeorm.git
          git -C /tmp/typeorm fetch --depth=1 origin "$TYPEORM_SOURCE_COMMIT"
          git -C /tmp/typeorm checkout --detach FETCH_HEAD
          test "$(git -C /tmp/typeorm rev-parse HEAD)" = "$TYPEORM_SOURCE_COMMIT"
      - name: Install pinned workspace dependencies
        working-directory: /tmp/typeorm
        run: |
          npm install --global pnpm@12.22.0
          pnpm --version
          pnpm install --filter typeorm... --include-workspace-root --frozen-lockfile --ignore-scripts
      - name: Compile TypeORM from pinned source
        working-directory: /tmp/typeorm
        run: pnpm --filter typeorm exec tsc -p tsconfig.node.json
      - name: Run pinned TypeORM transaction probe
        env:
          TYPEORM_SOURCE_COMMIT: "b1e211fc2654d412612a08f8a7fb890f3352614f"
        run: |
          node conformance/replication-lab/cases/TORM-PERSIST-001/source_probe.cjs > typeorm-source-capture.json
          python -c "import json; d=json.load(open('typeorm-source-capture.json')); assert d['passed'] is True; print('Pinned TypeORM runtime assertions passed')"
      - name: Run independent Python SQLite replica
        run: python conformance/replication-lab/projects/typeorm-sqlite-python/replica_probe.py > typeorm-replica-capture.json
      - name: Compare source and replica outcomes
        run: |
          python conformance/replication-lab/cases/TORM-PERSIST-001/compare.py typeorm-source-capture.json typeorm-replica-capture.json | tee typeorm-comparison.json
      - name: Run comparator mutation tests
        run: python -m unittest discover -s conformance/replication-lab/cases/TORM-PERSIST-001 -p "test_*.py" -v
      - name: Stage runtime evidence and build Software Rules captures
        run: |
          evidence_dir="conformance/replication-lab/cases/TORM-PERSIST-001/artifacts"
          mkdir -p "$evidence_dir"
          cp typeorm-source-capture.json "$evidence_dir/typeorm-source-runtime.json"
          cp typeorm-replica-capture.json "$evidence_dir/typeorm-python-runtime.json"
          cp /tmp/typeorm/pnpm-lock.yaml "$evidence_dir/pnpm-lock.yaml"
          python conformance/replication-lab/cases/TORM-PERSIST-001/build_software_rules_artifacts.py \
            --source "$GITHUB_WORKSPACE/$evidence_dir/typeorm-source-runtime.json" \
            --replica "$GITHUB_WORKSPACE/$evidence_dir/typeorm-python-runtime.json" \
            --output-dir "$GITHUB_WORKSPACE/typeorm-software-rules" \
            --lockfile "$GITHUB_WORKSPACE/$evidence_dir/pnpm-lock.yaml"
      - name: Validate Software Rules captures and evidence integrity
        run: |
          npm install --prefix conformance/validation --no-audit --no-fund
          node conformance/validation/validate-case-artifacts.mjs \
            "$GITHUB_WORKSPACE/typeorm-software-rules/typeorm-source.capture.json" \
            "$GITHUB_WORKSPACE/typeorm-software-rules/typeorm-python-replica.capture.json" \
            "$GITHUB_WORKSPACE/typeorm-software-rules/typeorm-comparison.report.json"
      - name: Commit verified TypeORM evidence to the repository
        if: success() && github.event_name != 'pull_request'
        run: |
          evidence_dir="conformance/replication-lab/cases/TORM-PERSIST-001/artifacts"
          cp typeorm-software-rules/typeorm-source.capture.json "$evidence_dir/typeorm-source.capture.json"
          cp typeorm-software-rules/typeorm-python-replica.capture.json "$evidence_dir/typeorm-python-replica.capture.json"
          cp typeorm-software-rules/typeorm-comparison.report.json "$evidence_dir/typeorm-comparison.report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence_dir"
          if ! git diff --cached --quiet; then
            git commit -m "test: retain verified TypeORM cross-stack evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Retain TypeORM source, replica, and Software Rules evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeorm-persistence-cross-stack-captures
          path: |
            typeorm-source-capture.json
            typeorm-replica-capture.json
            typeorm-comparison.json
            typeorm-software-rules/*.json
            conformance/replication-lab/cases/TORM-PERSIST-001/artifacts/*.json
            conformance/replication-lab/cases/TORM-PERSIST-001/artifacts/pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 30

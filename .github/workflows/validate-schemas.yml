name: Validate schemas

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "conformance/validation/**"
      - "comparison/**"
      - "comparison/**"
      - ".github/workflows/validate-schemas.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "conformance/validation/**"
      - ".github/workflows/validate-schemas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validator dependencies
        run: npm install --prefix conformance/validation
      - name: Validate schema fixtures
        run: npm run validate --prefix conformance/validation
